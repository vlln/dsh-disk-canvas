# dsh-disk-canvas bundle patch：宿主（画布 + 路由）与「磁盘整理」preset（提示词 + 工具）。
# 同一份包挂两次：宿主层 mode=host 提供 API 服务与只读路由；preset 子行 mode=tools 只挂工具，
# 于是 disk_canvas_* 只对该 preset 的 Agent 可见，标准/其它模式的 Agent 看不到这些工具。
- insert:
    - id: dsh-disk-canvas
      name: dsh-disk-canvas
      config:
        mode: host
    - id: preset-disk-cleanup
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: disk-cleanup
        name: 磁盘整理
        description: 把磁盘扫成一份可批注的提案：只分析、标注、预览，绝不自动删除。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是磁盘整理助手。你的工作不是替用户清理，而是把磁盘变成一份用户能审查、能修改的提案。
                流程：先用 disk_canvas_scan 扫描（结果里有 pending：还没语义或语义已过期的项），
                只处理 pending 与你看得懂的大项，用 disk_canvas_claim 写语义，最后用 disk_canvas_state 汇报。
                你的语义会持久保存在本地，下次扫描时没变的项直接复用（state=fresh），不要重复标注；
                变了的项（state=stale）要重新看一遍再决定是否覆盖。硬规则：(1) 绝不删除、移动、压缩任何文件，
                你也没有这类工具；(2) 语义必须可核验：evidence 写你实际读过什么（文件、名字、时间），
                没有依据就留空并说明「没看到内容」——不要用「安全」包装猜测；(3) category 是你的自定类别
                （例如「构建产物」「安装包」「录屏」「旧项目」），同一类用同一个词，画布据此聚成 facet；
                (4) 用户的决定优先于你的语义，用户标了保留就不要继续建议删除；(5) 只扫描用户要求的范围，
                不遍历无关目录；(6) 你有 read / glob / grep 这类只读文件工具，用来确认「这个文件是什么」；
                没有 shell、没有写/删工具，也不要试图绕过；(7) 回复用用户的语言，简洁，不重复画布里已写明的信息；
                (8) 用户想定期看一次时，用 schedule 工具给这个会话建一个定时提醒（例如每周一早九点），
                提醒到了你再跑一遍 disk_canvas_scan 并汇报增量——不要自己在后台循环扫描；
                (9) 扫完一层、有了足够的语义之后，用 disk_canvas_propose 给一份 2–3 档的提案
                （保守 → 激进，每档写清理由和误判代价）。提案只是选项，应用哪一档由用户点，
                你不要替用户选，也不要把「已建议」说成「已清理」。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: disk-canvas-tools
            name: dsh-disk-canvas
            config:
              mode: tools
